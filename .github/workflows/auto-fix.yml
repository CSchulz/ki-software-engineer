name: Auto-Fix CI Failures with Claude

on:
  workflow_run:
    workflows: ['CI']
    types:
      - completed

jobs:
  auto-fix:
    # Only run if the CI workflow failed
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Use the SHA from the failed workflow run
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Configure Codex
        run: |
          mkdir -p "$RUNNER_TEMP/codex-home"
      
          cat > "$RUNNER_TEMP/codex-home/config.toml" <<'EOF'
          default_permissions = "github-issues"
      
          [features]
          network_proxy = true
      
          [permissions.github-issues]
          extends = ":workspace"
      
          [permissions.github-issues.network]
          enabled = true
      
          [permissions.github-issues.network.domains]
          "api.github.com" = "allow"
          EOF

      - name: Autofix with Codex
        uses: openai/codex-action@v1
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          codex-home: ${{ runner.temp }}/codex-home
          permission-profile: github-issues
          safety-strategy: drop-sudo
          model: "gpt-5.6-luna"
          prompt: |
            A CI build has failed. Analyze the errors and fix them automatically.

            **Build Details:**
            - Repository: ${{ github.repository }}
            - Workflow: ${{ github.event.workflow_run.name }}
            - Branch: ${{ github.event.workflow_run.head_branch }}
            - Commit: ${{ github.event.workflow_run.head_sha }}
            - Workflow Run URL: ${{ github.event.workflow_run.html_url }}

            **Your Task:**
            1. Download the workflow logs and analyze the errors
            2. Identify the root causes (build errors, linting problems, tests, etc.)
            3. Perform automatic fixes for:
               - YAML syntax errors in frontmatter
               - TypeScript/JavaScript errors
               - Import/export problems
               - Package.json dependencies
            4. Test the fixes locally with `npm run build`
            5. Commit the changes with a descriptive commit message

            **Important Rules:**
            - Use Conventional Commits standard
            - ALWAYS test with `npm run build` before committing
            - If multiple fixes are needed, create separate commits
            - For critical errors, create an issue instead of auto-fixing

            **Example Commit Messages:**
            - `fix: yaml syntax error in blog frontmatter`
            - `chore: update dependencies to resolve build issues`

            Begin by analyzing the workflow logs!

      - name: Verify fixes with build test
        run: |
          echo "Testing if auto-fixes resolved the build issues..."
          npm run build

      - name: Create Pull Request if changes were made
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_BRANCH: ${{ github.event.workflow_run.head_branch }}
          FAILED_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          BRANCH_NAME="auto-fix/${FAILED_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          test "$(git branch --show-current)" = "$BRANCH_NAME"
          git diff --check
          git add --all
          if git diff --cached --quiet; then
            echo "No changes to publish."
            exit 0
          fi
          git commit -m "fix: resolve CI failure in run ${FAILED_RUN_ID}"
          git push --set-upstream origin "$BRANCH_NAME"
          gh pr create --repo "$GITHUB_REPOSITORY" \
            --base "$BASE_BRANCH" --head "$BRANCH_NAME" \
            --title "fix: resolve CI failure in run ${FAILED_RUN_ID}" \
            --body-file "$RUNNER_TEMP/auto-fix-summary.md"

  notify-failure:
    if: ${{ always() && needs.auto-fix.result == 'failure' }}
    needs: auto-fix
    runs-on: ubuntu-latest
    steps:
      - name: Create issue for failed auto-fix
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '🤖 Auto-Fix Failed - Manual Intervention Required',
              body: `## Auto-Fix Error

            The automatic fix for the CI error has failed.

            **Details:**
            - Workflow: ${{ github.event.workflow_run.name }}
            - Branch: ${{ github.event.workflow_run.head_branch }}
            - Commit: ${{ github.event.workflow_run.head_sha }}
            - Auto-Fix Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            - Original Failed Run: ${{ github.event.workflow_run.html_url }}

            Please review the logs and fix the issues manually.`,
              labels: ['bug', 'auto-fix-failed', 'needs-attention']
            })
