<div class="container mx-auto max-w-7xl px-4 py-12" *ngIf="vm$ | async as vm">
  <h1 class="mb-10 border-b border-gray-200 pb-4 text-3xl font-bold text-blue-700">Book Collection</h1>

  <div class="mb-6">
    <div class="flex items-center border-b-2 border-gray-300 py-2">
      <input
        type="search"
        [formControl]="searchTerm"
        placeholder="Search for books..."
        aria-label="Search books"
        class="mr-3 w-full appearance-none border-none bg-transparent px-2 py-1 leading-tight text-gray-700 focus:outline-none"
      />
      <button
        *ngIf="searchTerm.value"
        type="button"
        (click)="clearSearch()"
        aria-label="Clear search"
        class="flex-shrink-0 text-gray-500 hover:text-gray-700"
      >
        <svg aria-hidden="true" class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
        </svg>
      </button>
    </div>
  </div>

  <section *ngIf="vm.status === 'loading'" role="status" aria-live="polite" class="py-20 text-center">
    <div
      class="mx-auto h-16 w-16 animate-spin rounded-full border-4 border-b-gray-200 border-l-gray-200 border-r-blue-700 border-t-blue-700"
      aria-hidden="true"
    ></div>
    <p class="mt-4 text-gray-600">Loading books...</p>
  </section>

  <section
    *ngIf="vm.status === 'error'"
    role="alert"
    class="rounded-xl border border-red-200 bg-red-50 px-6 py-14 text-center"
  >
    <h2 class="text-2xl font-bold text-red-800">Unable to load books</h2>
    <p class="mt-3 text-red-700">The service is currently unavailable.</p>
    <button
      type="button"
      (click)="retry()"
      class="mt-5 rounded-md bg-red-700 px-4 py-2 font-medium text-white hover:bg-red-800"
    >
      Try again
    </button>
  </section>

  <div *ngIf="vm.status === 'success'" class="grid grid-cols-1 gap-8 sm:grid-cols-2 lg:grid-cols-4 xl:grid-cols-5">
    <app-book-item *ngFor="let book of vm.books; trackBy: trackById" [book]="book"></app-book-item>

    <div
      *ngIf="vm.books.length === 0"
      class="col-span-full flex flex-col items-center justify-center rounded-xl bg-gray-50 py-16 text-center"
    >
      <p class="mb-2 text-xl font-medium text-gray-600">
        {{ searchTerm.value ? 'No books match your search' : 'No books available' }}
      </p>
      <p class="text-gray-500">
        {{ searchTerm.value ? 'Try different search terms or clear the search' : 'Check back later' }}
      </p>
      <button
        *ngIf="searchTerm.value"
        type="button"
        (click)="clearSearch()"
        class="mt-4 rounded-md bg-blue-600 px-4 py-2 font-medium text-white hover:bg-blue-700"
      >
        Clear Search
      </button>
    </div>
  </div>
</div>
