<a
  [routerLink]="['/books', book.id]"
  class="group block h-full rounded-lg focus-visible:outline-none focus-visible:ring-4 focus-visible:ring-blue-300 focus-visible:ring-offset-2"
  [attr.aria-label]="'View details for ' + book.title"
>
  <article
    class="flex h-full flex-col overflow-hidden rounded-lg bg-white shadow-md transition-all duration-300 group-hover:-translate-y-1 group-hover:shadow-xl"
  >
    <div class="relative aspect-[3/4] overflow-hidden">
      <img
        *ngIf="book.cover"
        [src]="book.cover"
        [alt]="'Cover of ' + book.title"
        class="h-full w-full bg-gray-100 object-contain"
      />
      <div *ngIf="!book.cover" class="flex h-full w-full items-center justify-center bg-gray-100">
        <span class="text-sm font-medium text-gray-500">No cover available</span>
      </div>
    </div>
    <div class="flex flex-grow flex-col p-5">
      <h2 class="mb-1 line-clamp-2 text-lg font-semibold text-gray-800 group-hover:text-blue-700">
        {{ book.title }}
      </h2>
      <p *ngIf="book.subtitle" class="mb-2 line-clamp-2 text-sm text-gray-600">{{ book.subtitle }}</p>
      <div class="mt-auto text-sm text-gray-700">
        <p class="text-blue-700">{{ book.author }}</p>
        <p *ngIf="book.isbn" class="mt-2 text-xs text-gray-500">ISBN: {{ book.isbn }}</p>
      </div>
      <span class="mt-4 inline-flex items-center text-sm font-semibold text-blue-700" aria-hidden="true">
        View details <span class="ml-1 transition-transform group-hover:translate-x-1">→</span>
      </span>
    </div>
  </article>
</a>

<a
  [routerLink]="['/books', book.id, 'edit']"
  class="mt-3 inline-flex items-center rounded-md px-3 py-2 text-sm font-semibold text-blue-700 hover:bg-blue-50 focus-visible:outline-none focus-visible:ring-4 focus-visible:ring-blue-300"
>
  Edit {{ book.title }}
</a>
